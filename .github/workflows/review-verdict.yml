# .github/workflows/review-verdict.yml — reusable (workflow_call). Turns Codex's advisory review
# into the `review-verdict` commit status. Called by each gated repo's thin caller
# (.github/workflows/review-verdict.yml) and by this repo's review-verdict-self.yml.
# Spec: claude-dotfiles docs/superpowers/specs/2026-09-26-review-system-v4-design.md §6 (SSSF-23).
#
# The `github` context here is the CALLER's (event, payload, repository, token), so the jobs pick
# their mode from the caller's event:
#   poll   — pull_request opened/synchronize/reopened/ready_for_review. On synchronize (a new
#            head) it first asks Codex: one `@codex review` comment with a hidden per-SHA
#            marker, skipped for drafts, `hotfix`, closed PRs and heads someone already asked
#            about (SSSF-25, Blake 2026-09-28; reverses R32 "the gate never comments"). Then it
#            polls every 60 s until a verdict or the codex-unavailable failure, 30 min after the
#            clock start (asked_at, which the script derives from PR state: the latest of the
#            push, the PR's creation, the last draft->ready and the last reopen -- each of which
#            starts its own poller; `@codex review` comments never move it). SSSF-46: while it
#            polls it asks Codex itself, once per head, when nobody has: at +10 min, or at once
#            on a bot-authored PR (Codex reviews by itself only PRs its users authored, and its
#            review on open can be a bare 👍, which is never a verdict and fires no event). When
#            Codex answers, its reply ends the hold (~2 min after a request); only a request
#            nobody answers holds the full 30 min, and that PR goes red instead of hanging.
#            No cron: the $25/mo hard Actions budget cannot carry one per repo.
#   once   — every other event: one fetch -> compute -> post, or a drill (workflow_dispatch;
#            only `p1-open`, and a drill may only ever post failure -- R39: a success drill
#            satisfied the required check on any head). It never comments: only the poller,
#            serialized per PR, asks Codex, so a head is asked about once.
# pull_request `closed` runs nothing (a running poller sees the close and stops by itself).
# Codex silent: the poller asks at +10 (if nobody did) and posts the codex-unavailable failure
# at +30 (retry `@codex review` from your own account, or label `hotfix`). A poller that died
# early (3 straight gh errors) leaves the PR pending: recompute it with
# `gh workflow run <caller>.yml -f pr=<n>`; pending blocks the merge, so it fails safe.
# P2/P3 threads get a `queued-for-janitor` reply (the queue entry); the gate never resolves
# them (resolveReviewThread needs contents: write, which no caller grants). Event data and
# dispatch inputs reach shell only via env: (never ${{ }} inside run:). Agent order after a
# blocking finding: reply to each fixed thread naming the fix and resolve it, THEN push the
# fix (the gate asks Codex for the re-review). Every run after the push then sees those
# threads already resolved, and they clear (their findings predate the push). Thread replies
# also arrive as pull_request_review events (a GraphQL thread reply creates a COMMENTED
# review by the replier), but a bare resolve triggers nothing (pull_request_review_thread is
# not an Actions trigger); recompute by dispatching the caller with -f pr=<n>.
name: review-verdict
on:
  workflow_call:
    inputs:
      pr:    { type: number, required: false, default: 0 }
      drill: { type: string, required: false, default: "" }
permissions:
  contents: read
  checks: read            # fetch() reads checkSuites to date the push; without it gh exits 1 and nothing posts
  pull-requests: write    # the `@codex review` nudge comment and the queued-for-janitor thread reply (a PR
                          # comment needs only this: probe run 36483153709). No resolve: that needs
                          # contents: write, which no caller grants (SSSF-25, BJGLLC/.github#5)
  statuses: write         # the review-verdict status
  issues: read            # REST issue-comments scan for Codex's summary (R46)
defaults:
  run:
    shell: bash
jobs:
  poll:
    if: github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 35   # codex-unavailable at +30 + the last 60-s sleep + the nudges + slack (SSSF-46)
    concurrency:          # a newer push cancels the superseded poller for the same PR; one poller
                          # per PR at a time is also what makes the nudge's marker check race-free
      group: review-verdict-poll-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with: { repository: BJGLLC/.github, ref: main, persist-credentials: false }
      - name: Ask Codex to review the new head (synchronize only; once per head)
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::no PR number in the pull_request payload"; exit 1; }
          python3 scripts/review_verdict.py nudge "$GITHUB_REPOSITORY" "$PR"
      - name: Poll until Codex's verdict or codex-unavailable (<=30 min; asks Codex once if nobody has)
        if: ${{ !cancelled() }}   # a failed nudge (red, annotated) must not leave the head without a status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::no PR number in the pull_request payload"; exit 1; }
          python3 scripts/review_verdict.py poll "$GITHUB_REPOSITORY" "$PR"

  once:
    if: github.event_name != 'pull_request' || !contains(fromJSON('["opened","synchronize","reopened","ready_for_review","closed"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:          # one one-shot per PR at a time; a newer event waits (a pending one is
                          # replaced by the newest, which recomputes from fresh state). Racing
                          # runs double-replied on cd-marketing #165 (SSSF-25).
      group: review-verdict-once-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { repository: BJGLLC/.github, ref: main, persist-credentials: false }
      - name: Which PR
        id: which
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::no PR number for this $GITHUB_EVENT_NAME event (workflow_dispatch needs -f pr=<n>)"; exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Drill (red-proof) — post the fixture's verdict on the PR head
        if: inputs.drill != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.which.outputs.pr }}
          DRILL: ${{ inputs.drill }}
        run: |
          case "$DRILL" in p1-open) ;; *) echo "::error::unknown drill (only p1-open: a drill may only post failure)"; exit 1 ;; esac
          sha="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)"
          v="$(python3 scripts/review_verdict.py compute "scripts/drills/$DRILL.json")"
          echo "$v"
          state="$(jq -r .state <<<"$v")"
          [ "$state" = failure ] || { echo "::error::a drill may only post failure"; exit 1; }  # R39: never a passing status
          desc="DRILL $DRILL: $(jq -r .description <<<"$v")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context=review-verdict -f description="${desc:0:140}"
      - name: Compute + post the verdict
        if: inputs.drill == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.which.outputs.pr }}
        run: python3 scripts/review_verdict.py "$GITHUB_REPOSITORY" "$PR"
