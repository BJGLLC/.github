# .github/workflows/review-verdict-self.yml — this repo's own caller (SSSF-23, R12): the gate's
# repo is gated too, so its PRs get a `review-verdict` status. Same as the thin caller in every
# gated repo, including `uses: …@main` (R24): both the reusable workflow YAML and scripts/ come
# from main, so a PR here is judged by main's gate, never by the version it changes.
# Recompute by hand: gh workflow run review-verdict-self.yml -f pr=<n>
name: review-verdict-self
on:
  pull_request: { types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled] }
  pull_request_review: { types: [submitted] }   # also fires on thread replies (a reply is a COMMENTED review)
  issue_comment: { types: [created, edited] }   # Codex edits its sticky summary comment per round
  workflow_dispatch:
    inputs:
      pr:    { description: "PR number", required: true, type: number }
      drill: { description: "p1-open | clean | (empty = real)", required: false, type: string, default: "" }
permissions:
  contents: read
  checks: read
  pull-requests: write
  statuses: write
  issues: write
jobs:
  verdict:
    # Skipped jobs bill nothing. issue_comment: only Codex's own comments on a PR. pull_request:
    # label churn only for `hotfix`; nothing for a draft (ready_for_review arrives with draft=false
    # and starts the poller). No `closed` trigger: the gate posts no comments (R32), so a close has
    # nothing to do (a running poller notices it by itself).
    if: >-
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.user.login, 'chatgpt-codex-connector')))
      && (github.event_name != 'pull_request' || ((!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || github.event.label.name == 'hotfix')
      && !github.event.pull_request.draft))
    uses: BJGLLC/.github/.github/workflows/review-verdict.yml@main
    with:
      # R33: github.event.inputs values are strings (null outside workflow_dispatch); the
      # reusable input is type: number, so parse explicitly -- `inputs.pr || 0` passed '72'.
      pr: ${{ fromJSON(github.event.inputs.pr || '0') }}
      drill: ${{ inputs.drill || '' }}
