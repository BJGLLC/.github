# DRILL (SSSF-25) — throwaway, never merges.
# Round 1 (run 36480794129, commit before this one): resolveReviewThread needs contents: write.
# Round 2 (this commit): can the gate post a PR comment (the R32-reversal nudge) with the
# permissions the callers already grant (pull-requests: write, issues: read)?
name: perm-experiment
on:
  pull_request: { types: [synchronize] }
jobs:
  exp-d-prw-issues-read:
    runs-on: ubuntu-latest
    permissions: { pull-requests: write, issues: read, contents: read }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="SSSF-25 probe D (pull-requests write, issues read)" --jq .html_url
  exp-e-prread-issues-write:
    runs-on: ubuntu-latest
    permissions: { pull-requests: read, issues: write, contents: read }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}" }
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="SSSF-25 probe E (pull-requests read, issues write)" --jq .html_url
