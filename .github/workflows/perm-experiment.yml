# DRILL (SSSF-25) — throwaway, never merges. Which GITHUB_TOKEN permission does
# resolveReviewThread need? Each job resolves its own thread (matched by body) with a
# different permission set; job A also re-checks that the queue reply works with today's set.
name: perm-experiment
on:
  pull_request: { types: [synchronize] }
jobs:
  exp-a-prw-contents-read:
    runs-on: ubuntu-latest
    permissions: { pull-requests: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: bash drills-sssf-25/resolve.sh
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", MARK: exp-A, REPLY: "1" }
  exp-b-prw-contents-write:
    runs-on: ubuntu-latest
    permissions: { pull-requests: write, contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: bash drills-sssf-25/resolve.sh
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", MARK: exp-B, REPLY: "0" }
  exp-c-prread-contents-write:
    runs-on: ubuntu-latest
    permissions: { pull-requests: read, contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - run: bash drills-sssf-25/resolve.sh
        env: { GH_TOKEN: "${{ github.token }}", PR: "${{ github.event.pull_request.number }}", MARK: exp-C, REPLY: "0" }
